name: Build KJV Android APK

on:
  push:
    branches:
      - build-kjv-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore KJV source ZIP
        shell: bash
        run: |
          cat tmp-kjv-build/KJV-Holy-Bible-MVP.zip.b64.part* > "$RUNNER_TEMP/kjv.zip.b64"
          base64 -d "$RUNNER_TEMP/kjv.zip.b64" > "$RUNNER_TEMP/kjv.zip"
          mkdir -p "$RUNNER_TEMP/kjv-src"
          unzip -q "$RUNNER_TEMP/kjv.zip" -d "$RUNNER_TEMP/kjv-src"
          test -f "$RUNNER_TEMP/kjv-src/kjv_holy_bible/pubspec.yaml"

      - name: Apply v0.3 feature update
        shell: bash
        run: |
          cat tmp-kjv-build/v03-patch.b64.part* > "$RUNNER_TEMP/v03-patch.b64"
          base64 -d "$RUNNER_TEMP/v03-patch.b64" > "$RUNNER_TEMP/v03-patch.zip"
          unzip -oq "$RUNNER_TEMP/v03-patch.zip" -d "$RUNNER_TEMP/kjv-src/kjv_holy_bible"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: flutter create --platforms=android --org org.lordofthesabbath --project-name kjv_holy_bible .

      - name: Configure Android API 36
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: python tool/configure_android.py

      - name: Allow Android TTS service discovery
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.intent.action.TTS_SERVICE" not in s:
              queries = """    <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          """
              s = s.replace("</manifest>", queries + "</manifest>")
              p.write_text(s)
          PY

      - name: Bundle complete KJV corpus and formatting markers
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: python tool/fetch_kjv.py

      - name: Generate public-domain instrumental audio
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: python tool/generate_audio.py

      - name: Install Flutter dependencies
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ runner.temp }}/kjv-src/kjv_holy_bible
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          cp "$RUNNER_TEMP/kjv-src/kjv_holy_bible/build/app/outputs/flutter-apk/app-release.apk" "$RUNNER_TEMP/KJV-Holy-Bible-v0.3.apk"
          sha256sum "$RUNNER_TEMP/KJV-Holy-Bible-v0.3.apk" > "$RUNNER_TEMP/KJV-Holy-Bible-v0.3.apk.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KJV-Holy-Bible-v0.3-Android-APK
          path: |
            ${{ runner.temp }}/KJV-Holy-Bible-v0.3.apk
            ${{ runner.temp }}/KJV-Holy-Bible-v0.3.apk.sha256
          retention-days: 7
